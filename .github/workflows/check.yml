name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1 and busted
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua-busted

      - name: Run tests
        run: busted tests/TakeItOff_spec.lua
