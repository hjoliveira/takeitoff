name: Release

on:
  workflow_dispatch:

jobs:
  check:
    name: Run Checks
    uses: ./.github/workflows/check.yml

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from TOC file
        id: version
        run: |
          VERSION=$(grep -E "^## Version:" TakeItOff/TakeItOff.toc | sed 's/## Version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Create addon zip
        run: |
          zip -r TakeItOff-${{ steps.version.outputs.version }}.zip TakeItOff

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: TakeItOff v${{ steps.version.outputs.version }}
          files: TakeItOff-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
